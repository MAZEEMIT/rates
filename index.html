<style>
/* Layout: sticky header with tabs and search, then one dense table per group; bonus tab ends with a claim checker. */
:root{
  --bg:#f6f8fa; --surface:#ffffff; --fg:#14202b; --muted:#5b6b79; --line:#dbe3ea;
  --accent:#0a7fb8; --head:#00AFEF; --head-fg:#ffffff; --hl:#fff3a3; --hl-fg:#4a3b00;
  --na:#97a4af; --good:#15803d;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222c; --fg:#e6edf3; --muted:#93a3b1; --line:#27384a;
  --accent:#4fc3f7; --head:#0b6d99; --head-fg:#ffffff; --hl:#5c4f10; --hl-fg:#ffe98a;
  --na:#6b7c8a; --good:#4ade80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222c; --fg:#e6edf3; --muted:#93a3b1; --line:#27384a;
  --accent:#4fc3f7; --head:#0b6d99; --head-fg:#ffffff; --hl:#5c4f10; --hl-fg:#ffe98a;
  --na:#6b7c8a; --good:#4ade80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:20px;margin:2px 0 10px;font-weight:700;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:focus-visible,#q:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 180px;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12.5px;margin:12px 0 4px}
.chip{display:inline-block;padding:0 6px;border-radius:3px;background:var(--hl);color:var(--hl-fg);font-weight:600}
section{margin-top:22px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--head-fg);text-align:left;font-size:12px;padding:8px 10px;white-space:nowrap;font-weight:600}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
td.sr{color:var(--muted);width:1%}
.name{font-weight:600}
.na{color:var(--na)}
td.hl{background:var(--hl);color:var(--hl-fg);font-weight:700}
.after{font-weight:600}
.empty{padding:16px;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:70ch}
.calc{margin-top:26px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px}
.calc h2{margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.out{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.out div{border-top:2px solid var(--line);padding-top:6px}
.out span{display:block;font-size:12px;color:var(--muted)}
.out b{font-size:17px;font-variant-numeric:tabular-nums}
.bad{color:#d33a2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bad{color:#ff8a80}}
:root[data-theme="dark"] .bad{color:#ff8a80}
[hidden]{display:none!important}
</style>

var tab="el", query="";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(v){return v==null?'<span class="na">—</span>':(Math.round(v*100)/100).toLocaleString("en-US",{minimumFractionDigits:v%1?2:0})}
function match(r){return !query||r[0].toLowerCase().indexOf(query)>-1}

function priceTable(title,rows){
  var f=rows.filter(match), h="";
  f.forEach(function(r,i){
    h+='<tr><td class="sr">'+(rows.indexOf(r)+1)+'</td><td class="name">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="n">'+fmt(r[2])+
       '</td><td class="n'+(r[4]?' hl':'')+'">'+fmt(r[3])+'</td></tr>';
  });
  return '<section><h2>'+esc(title)+'</h2><div class="scroll">'+(f.length?
    '<table><thead><tr><th>#</th><th>Product</th><th>Pack</th><th class="n">MRP</th><th class="n">DP (TP)</th></tr></thead><tbody>'+h+'</tbody></table>'
    :'<div class="empty">No product matches your search.</div>')+'</div></section>';
}
function bonusTable(title,rows,start){
  var f=rows.filter(match), h="";
  f.forEach(function(r){
    h+='<tr><td class="sr">'+(start+rows.indexOf(r))+'</td><td class="name">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="n">'+r[2]+
       '</td><td class="n'+(r[6]?' hl':'')+'">'+r[3]+' + '+r[4]+'</td><td class="n after'+(r[6]?' hl':'')+'">'+r[5]+'</td></tr>';
  });
  return '<section><h2>'+esc(title)+'</h2><div class="scroll">'+(f.length?
    '<table><thead><tr><th>#</th><th>Product</th><th>Pack</th><th class="n">TP incl. GST</th><th class="n">Bonus</th><th class="n">After bonus</th></tr></thead><tbody>'+h+'</tbody></table>'
    :'<div class="empty">No product matches your search.</div>')+'</div></section>';
}
var GL={el:"Elegant",ex:"Excellent (Millennium)",sv:"Excellent (Sellvis)"};
var ALLB=[];
BE.forEach(function(r){ALLB.push({r:r,g:"el"})});
BX.forEach(function(r){ALLB.push({r:r,g:"ex"})});
BS.forEach(function(r){ALLB.push({r:r,g:"sv"})});
function schemes(){
  var s=[];
  ALLB.forEach(function(o){var k=o.r[3]+"+"+o.r[4];if(s.indexOf(k)<0)s.push(k)});
  s.sort(function(a,b){return parseInt(b)-parseInt(a)||a.localeCompare(b)});
  return s;
}
function calc(){
  var g='<option value="all">All groups</option>'+Object.keys(GL).map(function(k){return '<option value="'+k+'">'+GL[k]+'</option>'}).join("");
  var b='<option value="all">All bonus schemes</option>'+schemes().map(function(x){return '<option value="'+x+'">'+x+'</option>'}).join("");
  return '<div class="calc"><h2>Bonus claim check</h2><div class="fields">'+
   '<label>Group<select id="c-g">'+g+'</select></label>'+
   '<label>Bonus scheme<select id="c-b">'+b+'</select></label>'+
   '<label>Product<select id="c-p"></select></label>'+
   '<label>Quantity sold<input id="c-s" type="number" min="0" inputmode="numeric" value="272"></label>'+
   '<label>Bonus units claimed<input id="c-c" type="number" min="0" inputmode="numeric" value="27"></label></div>'+
   '<p class="note" id="c-n"></p><div class="out" id="c-o"></div>'+
   '<p class="note">Maximum valid bonus units = sold quantity ÷ N, rounded down. Excess units are valued at TP and removed from the claim, then the 12% DP discount is deducted. Add up the products from the rows; never use the SSR total cell.</p></div>';
}
function fillProducts(){
  var g=$("c-g").value,b=$("c-b").value,h="",n=0;
  ALLB.forEach(function(o,i){
    if((g==="all"||o.g===g)&&(b==="all"||o.r[3]+"+"+o.r[4]===b)){
      n++;h+='<option value="'+i+'">'+esc(o.r[0])+' '+esc(o.r[1])+' · '+o.r[3]+'+'+o.r[4]+'</option>';
    }
  });
  $("c-p").innerHTML=h||'<option value="">No product with this bonus</option>';
  $("c-n").textContent=n+(n===1?" product":" products")+" to choose from";
  runCalc();
}
function runCalc(){
  var o=ALLB[+$("c-p").value];
  if(!o||$("c-p").value===""){$("c-o").innerHTML="";return}
  var r=o.r, s=+$("c-s").value||0, c=+$("c-c").value||0;
  var max=Math.floor(s/r[3]), ok=Math.min(c,max), ex=c-ok;
  var claim=c*r[2], exv=ex*r[2], net=(claim-exv)*0.88;
  var rs=function(v){return "Rs "+(Math.round(v*100)/100).toLocaleString("en-US")};
  $("c-o").innerHTML=
   '<div><span>TP</span><b>'+r[2]+'</b></div>'+
   '<div><span>Max valid bonus units</span><b>'+max+'</b></div>'+
   '<div><span>Excess units</span><b class="'+(ex?'bad':'')+'">'+ex+'</b></div>'+
   '<div><span>Claim value at TP</span><b>'+rs(claim)+'</b></div>'+
   '<div><span>Excess value</span><b>'+rs(exv)+'</b></div>'+
   '<div><span>Payable after 12% DP discount</span><b>'+rs(net)+'</b></div>';
}
function renderBT(){
  $("bt").innerHTML=bonusTable("Elegant Group",BE,1)+bonusTable("Excellent Group (Millennium)",BX,BE.length+1)+bonusTable("Excellent Group (Sellvis)",BS,BE.length+BX.length+1);
}
function render(){
  var lg=$("legend"), m=$("main");
  if(tab==="el"){
    lg.innerHTML='<span><span class="chip">Yellow</span> rate changed this month</span><span><span class="na">—</span> not available yet</span><span>DP is commonly called TP</span>';
    m.innerHTML=priceTable("Elegant Group",EL);
  }else if(tab==="ex"){
    lg.innerHTML='<span>Empty rate means not available yet. Empty MRP only means MRP not known.</span><span>DP is commonly called TP</span>';
    m.innerHTML=priceTable("Excellent Group (Millennium)",EXM)+priceTable("Sellvis (Fresh Pharma)",SF)+priceTable("Sellvis (Al Ain Neutro)",SA);
  }else{
    lg.innerHTML='<span><span class="chip">Yellow</span> changed this month</span><span>Bonus slabs below 10+1 are special bonuses for stock clearance</span>';
    m.innerHTML='<div id="bt"></div>'+calc();
    renderBT();
    $("c-g").addEventListener("change",fillProducts);
    $("c-b").addEventListener("change",fillProducts);
    ["c-p","c-s","c-c"].forEach(function(id){$(id).addEventListener("input",runCalc)});
    fillProducts();
  }
}
function setTab(t){
  tab=t;
  [["el","t-el"],["ex","t-ex"],["bo","t-bo"]].forEach(function(x){$(x[1]).setAttribute("aria-selected",x[0]===t?"true":"false")});
  render();
}
$("t-el").onclick=function(){setTab("el")};
$("t-ex").onclick=function(){setTab("ex")};
$("t-bo").onclick=function(){setTab("bo")};
$("q").addEventListener("input",function(e){
  query=e.target.value.trim().toLowerCase();
  if(tab==="bo")renderBT();else render();
});
render();
</script>
